
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 1200 675"
     role="img"
     aria-label="Samuel Alcântara — Animated Developer Profile">

  <title>Samuel Alcântara | Developer Profile</title>

  <style><![CDATA[
    /* =====================================
       01. BASE & TYPOGRAPHY
    ===================================== */

    text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-weight: 400;
      text-rendering: geometricPrecision;
    }

    .white  { fill: #e8e8e8; }
    .gray   { fill: #999999; }
    .muted  { fill: #646464; }
    .green  { fill: #79dfbd; }

    .normal { font-size: 17px; }
    .small  { font-size: 15px; }
    .tiny   { font-size: 12px; }

    .name {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -.35px;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.3px;
    }

    .divider {
      stroke: #292929;
      stroke-width: 1;
    }

    .frame {
      fill: #0a0a0a;
      stroke: #414141;
      stroke-width: 1.2;
    }

    /* =====================================
       02. BOOT SEQUENCE
    ===================================== */

    .boot {
      opacity: 0;
      animation: boot-exit 4.25s ease .1s both;
    }

    .boot-heading {
      opacity: 0;
      animation: fade-up .35s ease .28s both;
    }

    .boot-icon {
      transform-box: fill-box;
      transform-origin: center;
      animation: boot-rotate .85s ease .3s both;
    }

    .boot-line {
      opacity: 0;
      animation: line-in .28s ease both;
    }

    .boot-line.one   { animation-delay: .78s; }
    .boot-line.two   { animation-delay: 1.3s; }
    .boot-line.three { animation-delay: 1.82s; }

    .boot-check {
      opacity: 0;
      animation: check-in .24s ease both;
    }

    .check-one   { animation-delay: 1.08s; }
    .check-two   { animation-delay: 1.6s; }
    .check-three { animation-delay: 2.12s; }

    .progress-track {
      opacity: 0;
      animation: fade-up .25s ease .82s both;
    }

    .progress-fill {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: progress 1.55s cubic-bezier(.4,0,.2,1) 1s both;
    }

    .boot-ready {
      opacity: 0;
      animation: fade-up .3s ease 2.78s both;
    }

    .ready-dot {
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* =====================================
       03. COMPOSER & INPUT
    ===================================== */

    .composer {
      opacity: 0;
      animation: fade-up .35s ease 4.3s both;
    }

    .input-text {
      clip-path: inset(0 100% 0 0);
    }

    .command-one {
      animation:
        typewriter .65s steps(6,end) 4.65s both,
        clear-input .12s ease 5.43s forwards;
    }

    .command-two {
      animation:
        typewriter .76s steps(12,end) 10.28s both,
        clear-input .12s ease 11.18s forwards;
    }

    .hint-start {
      opacity: 0;
      animation: hint-start .34s ease 4.42s both;
    }

    .hint-between {
      opacity: 0;
      animation: hint-between 4.2s ease 5.75s both;
    }

    .hint-end {
      opacity: 0;
      animation: fade-up .32s ease 15.6s both;
    }

    .cursor {
      opacity: 0;
    }

    .cursor-one {
      animation:
        cursor-visible .65s linear 4.65s both,
        cursor-move-one .65s steps(6,end) 4.65s both;
    }

    .cursor-two {
      animation:
        cursor-visible .76s linear 10.28s both,
        cursor-move-two .76s steps(12,end) 10.28s both;
    }

    .block {
      fill: #79dfbd;
      animation: blink .85s steps(2,start) infinite;
    }

    .idle-cursor {
      opacity: 0;
      animation:
        fade-up .25s ease 15.8s both,
        blink .85s steps(2,start) 15.8s infinite;
    }

    .enter {
      opacity: 0;
    }

    .enter-one { animation: enter-press .3s ease 5.43s both; }
    .enter-two { animation: enter-press .3s ease 11.18s both; }

    /* =====================================
       04. USER MESSAGES
    ===================================== */

    .user {
      opacity: 0;
      animation: message-in .3s ease both;
    }

    .user-one { animation-delay: 5.62s; }
    .user-two { animation-delay: 11.38s; }

    /* =====================================
       05. THINKING STATE
    ===================================== */

    .thinking {
      opacity: 0;
      animation: thinking-cycle 1.05s ease both;
    }

    .thinking-one { animation-delay: 5.92s; }
    .thinking-two { animation-delay: 11.68s; }

    .thinking-icon {
      fill: #79dfbd;
      transform-box: fill-box;
      transform-origin: center;
      animation: hex-pulse 1.2s ease-in-out infinite;
    }

    /* =====================================
       06. COMPLETED RESPONSE MARKERS
    ===================================== */

    .answered-hex {
      fill: #777777;
      opacity: 0;
      animation: marker-in .24s ease both;
    }

    .marker-one { animation-delay: 7.03s; }
    .marker-two { animation-delay: 12.79s; }

    /* =====================================
       07. RESPONSE CONTENT
    ===================================== */

    .typed {
      clip-path: inset(0 100% 0 0);
    }

    .r-name {
      animation: typewriter .58s steps(16,end) 7.18s both;
    }

    .r-role {
      animation: typewriter .9s steps(50,end) 7.85s both;
    }

    .r-description {
      animation: typewriter .82s steps(49,end) 8.82s both;
    }

    .stack-label {
      opacity: 0;
      animation: stack-label-in .22s ease both;
    }

    .languages-label { animation-delay: 12.94s; }
    .backend-label   { animation-delay: 13.82s; }
    .database-label  { animation-delay: 14.7s; }

    .r-languages {
      animation: typewriter .78s steps(40,end) 13.08s both;
    }

    .r-backend {
      animation: typewriter .76s steps(35,end) 13.96s both;
    }

    .r-database {
      animation: typewriter .48s steps(16,end) 14.84s both;
    }

    /* =====================================
       08. FOOTER
    ===================================== */

    .footer {
      opacity: 0;
      animation: fade-up .35s ease 15.8s both;
    }

    .status {
      animation: pulse 2s ease-in-out infinite;
    }

    /* =====================================
       09. KEYFRAMES
    ===================================== */

    @keyframes boot-exit {
      0% { opacity: 0; }
      8%, 82% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes line-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes check-in {
      from { opacity: 0; transform: translateY(2px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes stack-label-in {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes boot-rotate {
      from { transform: rotate(-90deg) scale(.6); }
      to   { transform: rotate(270deg) scale(1); }
    }

    @keyframes progress {
      to { transform: scaleX(1); }
    }

    @keyframes typewriter {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }

    @keyframes clear-input {
      to { opacity: 0; }
    }

    @keyframes cursor-visible {
      0% { opacity: 0; }
      5%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes cursor-move-one {
      from { transform: translateX(0); }
      to   { transform: translateX(54px); }
    }

    @keyframes cursor-move-two {
      from { transform: translateX(0); }
      to   { transform: translateX(108px); }
    }

    @keyframes enter-press {
      0% { opacity: 0; transform: translateY(2px); }
      25%, 65% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes thinking-cycle {
      0% { opacity: 0; }
      12%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes hex-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .52; transform: scale(.94); }
    }

    @keyframes marker-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes hint-start {
      0% { opacity: 0; }
      25%, 75% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes hint-between {
      0% { opacity: 0; }
      5%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes pulse {
      50% { opacity: .4; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* =====================================
       10. REDUCED MOTION
    ===================================== */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }

      .boot,
      .thinking,
      .hint-start,
      .hint-between,
      .cursor,
      .enter {
        display: none;
      }

      .composer,
      .user,
      .answered-hex,
      .footer,
      .hint-end,
      .stack-label {
        opacity: 1;
      }

      .typed,
      .input-text {
        clip-path: none;
      }

      .idle-cursor,
      .status,
      .ready-dot {
        animation: none !important;
      }
    }
  ]]></style>

  <!-- CANVAS & HEADER -->

  <rect width="1200" height="675" fill="#080808"/>

  <circle cx="130" cy="42" r="4" class="green status"/>

  <text x="150" y="49" class="gray small">samuel@github</text>

  <text x="1075" y="49" text-anchor="end" class="muted tiny">
    DEVELOPER PROFILE
  </text>

  <line x1="125" y1="77" x2="1075" y2="77" class="divider"/>

  <!-- BOOT SEQUENCE -->

  <g class="boot">
    <g class="boot-heading">
      <polygon points="145,96 154,101 154,111 145,116 136,111 136,101"
               fill="none" stroke="#79dfbd" stroke-width="1.5"
               class="boot-icon"/>

      <text x="180" y="113" class="white normal">INITIALIZING SYSTEM</text>
      <text x="180" y="139" class="muted tiny">SAMUEL / ENGINEERING WORKSPACE</text>
    </g>

    <g class="boot-line one">
      <text x="180" y="177" class="gray small">Loading runtime environment</text>
    </g>
    <text x="720" y="177" text-anchor="end" class="green tiny boot-check check-one">OK</text>

    <g class="boot-line two">
      <text x="180" y="209" class="gray small">Checking system components</text>
    </g>
    <text x="720" y="209" text-anchor="end" class="green tiny boot-check check-two">OK</text>

    <g class="boot-line three">
      <text x="180" y="241" class="gray small">Mounting developer workspace</text>
    </g>
    <text x="720" y="241" text-anchor="end" class="green tiny boot-check check-three">OK</text>

    <g class="progress-track">
      <rect x="180" y="265" width="540" height="4" fill="#242424"/>
      <rect x="180" y="265" width="540" height="4"
            fill="#79dfbd" class="progress-fill"/>
    </g>

    <g class="boot-ready">
      <circle cx="185" cy="297" r="4" fill="#79dfbd" class="ready-dot"/>
      <text x="200" y="302" class="green tiny">SYSTEM READY</text>
      <text x="720" y="302" text-anchor="end" class="muted tiny">100%</text>
    </g>
  </g>

  <!-- CONVERSATION 01 — IDENTITY -->

  <g class="user user-one">
    <text x="145" y="133" class="green normal">›</text>
    <text x="180" y="133" class="white normal">whoami</text>
  </g>

  <g class="thinking thinking-one">
    <polygon points="145,166 152,170 152,178 145,182 138,178 138,170"
             class="thinking-icon"/>
    <text x="180" y="181" class="gray normal">Thinking...</text>
  </g>

  <polygon points="145,201 152,205 152,213 145,217 138,213 138,205"
           class="answered-hex marker-one"/>

  <g>
    <text x="180" y="222" class="white name typed r-name">Samuel Alcântara</text>
    <text x="180" y="254" class="gray small typed r-role">
      Computer Science Student · Early-career AI Engineer
    </text>
    <text x="180" y="286" class="muted small typed r-description">
      Building software and exploring intelligent systems.
    </text>
  </g>

  <line x1="180" y1="313" x2="1075" y2="313" class="divider"/>

  <!-- CONVERSATION 02 — TECH STACK -->

  <g class="user user-two">
    <text x="145" y="345" class="green normal">›</text>
    <text x="180" y="345" class="white normal">stack --list</text>
  </g>

  <g class="thinking thinking-two">
    <polygon points="145,378 152,382 152,390 145,394 138,390 138,382"
             class="thinking-icon"/>
    <text x="180" y="393" class="gray normal">Thinking...</text>
  </g>

  <polygon points="145,413 152,417 152,425 145,429 138,425 138,417"
           class="answered-hex marker-two"/>

  <g>
    <text x="180" y="434" class="muted label stack-label languages-label">LANGUAGES</text>
    <text x="310" y="434" class="white small typed r-languages">
      TypeScript · JavaScript · Python · Rust
    </text>

    <text x="180" y="466" class="muted label stack-label backend-label">BACKEND</text>
    <text x="310" y="466" class="gray small typed r-backend">
      FastAPI · Flask · Express · Fastify
    </text>

    <text x="180" y="498" class="muted label stack-label database-label">DATABASE</text>
    <text x="310" y="498" class="gray small typed r-database">
      SQL · PostgreSQL
    </text>
  </g>

  <!-- CHAT COMPOSER -->

  <g class="composer">
    <rect x="125" y="548" width="950" height="58" rx="3" class="frame"/>

    <text x="151" y="585" class="green normal">›</text>

    <text x="180" y="585" class="muted small hint-start">type a command...</text>
    <text x="180" y="585" class="muted small hint-between">waiting for input...</text>
    <text x="180" y="585" class="white small input-text command-one">whoami</text>
    <text x="180" y="585" class="white small input-text command-two">stack --list</text>

    <g class="cursor cursor-one">
      <rect x="180" y="563" width="9" height="27" class="block"/>
    </g>

    <g class="cursor cursor-two">
      <rect x="180" y="563" width="9" height="27" class="block"/>
    </g>

    <g class="enter enter-one">
      <text x="1047" y="585" text-anchor="middle" class="green normal">↵</text>
    </g>

    <g class="enter enter-two">
      <text x="1047" y="585" text-anchor="middle" class="green normal">↵</text>
    </g>

    <text x="180" y="585" class="muted small hint-end">
      always building something...
    </text>

    <rect x="426" y="567" width="9" height="24" class="green idle-cursor"/>
  </g>

  <!-- FOOTER -->

  <g class="footer">
    <text x="125" y="651" class="muted tiny">github.com/alcantara</text>

    <text x="1075" y="651" text-anchor="end" class="green tiny">
      <tspan class="status">●</tspan>
      <tspan dx="8">BUILDING</tspan>
    </text>
  </g>

</svg>
