<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="900"
     viewBox="0 0 1100 900">

  <defs>
    <style>
      .mono {
        font-family: "Courier New", monospace;
      }

      .white { fill: #e5e5e5; }
      .gray { fill: #777; }
      .dark { fill: #454545; }

      .heading {
        font-size: 32px;
        fill: #eee;
      }

      .tab {
        font-size: 23px;
      }

      .item {
        font-size: 23px;
        fill: #dedede;
      }

      .label {
        font-size: 13px;
        letter-spacing: 2px;
        fill: #777;
      }

      .border {
        stroke: #414141;
        stroke-width: 1.5;
        fill: none;
      }

      .line {
        stroke: #333;
        stroke-width: 1;
      }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->

  <rect width="1100" height="900" fill="#111"/>

  <!-- Grid -->

  <path d="M120 0V900 M0 130H1100"
        stroke="#292929" stroke-width="2"/>

  <circle cx="120" cy="130" r="3"
          fill="#eee" filter="url(#glow)"/>

  <g class="mono">

    <!-- Header -->

    <text x="190" y="65" class="gray"
          font-size="15">
      github.com/alcantara
    </text>

    <text x="190" y="215" class="heading">
      Samuel Alcântara
    </text>

    <text x="192" y="255" class="gray"
          font-size="20">
      Computer Science Student
    </text>

    <text x="192" y="290" class="gray"
          font-size="15">
      SOFTWARE ENGINEERING / AI ENGINEERING
    </text>

    <!-- Main heading -->

    <text x="190" y="385" class="white"
          font-size="29">
      My Stack
    </text>

    <!-- Navigation -->

    <text x="190" y="450"
          class="tab white">
      Languages
    </text>

    <text x="375" y="450"
          class="tab gray">
      Backend
    </text>

    <text x="555" y="450"
          class="tab gray">
      Data
    </text>

    <text x="700" y="450"
          class="tab gray">
      AI
    </text>

    <path d="M190 480H1020" class="line"/>

    <rect x="190" y="478"
          width="105" height="4"
          fill="#eee" filter="url(#glow)"/>

    <!-- Languages -->

    <text x="190" y="535" class="label">
      01 / PROGRAMMING LANGUAGES
    </text>

    <rect x="190" y="555"
          width="65" height="65" class="border"/>

    <path d="M207 588L221 602L240 574"
          stroke="#eee" stroke-width="2"
          fill="none"/>

    <text x="285" y="595" class="item">
      TypeScript
    </text>

    <rect x="600" y="555"
          width="65" height="65" class="border"/>

    <path d="M617 588L631 602L650 574"
          stroke="#eee" stroke-width="2"
          fill="none"/>

    <text x="695" y="595" class="item">
      JavaScript
    </text>

    <rect x="190" y="645"
          width="65" height="65" class="border"/>

    <path d="M207 678L221 692L240 664"
          stroke="#eee" stroke-width="2"
          fill="none"/>

    <text x="285" y="685" class="item">
      Python
    </text>

    <rect x="600" y="645"
          width="65" height="65" class="border"/>

    <path d="M617 678L631 692L650 664"
          stroke="#eee" stroke-width="2"
          fill="none"/>

    <text x="695" y="685" class="item">
      SQL
    </text>

    <!-- Backend -->

    <path d="M190 745H1020" class="line"/>

    <text x="190" y="790" class="label">
      02 / BACKEND & SYSTEMS
    </text>

    <text x="190" y="835" class="item">
      Node.js
    </text>

    <text x="380" y="835" class="item">
      Express
    </text>

    <text x="560" y="835" class="item">
      Fastify
    </text>

    <text x="740" y="835" class="item">
      FastAPI
    </text>

  </g>
</svg>
