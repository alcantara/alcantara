
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 1200 620"
     role="img"
     aria-label="Samuel Alcântara — Animated Developer Chat">

  <title>Samuel Alcântara — Developer Chat</title>

  <style>
    text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .white { fill: #e8e8e8; }
    .gray { fill: #858585; }
    .dim { fill: #515151; }
    .green { fill: #79dfbd; }

    .small { font-size: 13px; }
    .normal { font-size: 16px; }
    .name { font-size: 21px; font-weight: 600; }
    .label { font-size: 11px; letter-spacing: 1.5px; }

    .border {
      fill: none;
      stroke: #303030;
      stroke-width: 1;
    }

    .message {
      opacity: 0;
      animation: message-in .65s ease forwards;
    }

    .m1 { animation-delay: .3s; }
    .m2 { animation-delay: 1.1s; }
    .m3 { animation-delay: 2.1s; }
    .m4 { animation-delay: 2.9s; }
    .m5 { animation-delay: 3.8s; }

    .bubble-user {
      fill: #151a19;
      stroke: #29473d;
      stroke-width: 1;
    }

    .bubble-response {
      fill: #111316;
      stroke: #292929;
      stroke-width: 1;
    }

    .dot {
      animation: typing 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    .cursor {
      animation: blink 1s steps(2, start) infinite;
    }

    .online {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%, 60%, 100% { opacity: .3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .message, .dot, .cursor, .online {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="620" fill="#0b0d10"/>

  <!-- Chat window -->
  <rect x="75" y="45" width="1050" height="530"
        rx="7" class="border"/>

  <!-- Header -->
  <g>
    <circle cx="108" cy="80" r="4" fill="#79dfbd" class="online"/>

    <text x="124" y="85" class="white normal">
      samuel@workspace
    </text>

    <text x="1090" y="83" text-anchor="end"
          class="dim label">
      DEVELOPER SESSION
    </text>

    <line x1="75" y1="108" x2="1125" y2="108"
          class="border"/>
  </g>

  <!-- Message 1: User -->
  <g class="message m1">
    <rect x="690" y="139" width="385" height="49"
          rx="5" class="bubble-user"/>

    <text x="713" y="169" class="green normal">
      whoami --profile
    </text>

    <text x="1088" y="169" class="dim small">↵</text>
  </g>

  <!-- Message 2: Profile -->
  <g class="message m2">
    <polygon points="113,229 121,234 121,244 113,249 105,244 105,234"
             class="green"/>

    <text x="139" y="237" class="dim label">
      PROFILE
    </text>

    <rect x="135" y="251" width="660" height="82"
          rx="5" class="bubble-response"/>

    <text x="159" y="282" class="white name">
      Samuel Alcântara
    </text>

    <text x="159" y="310" class="gray normal">
      Computer Science Student · AI Engineer
    </text>
  </g>

  <!-- Message 3: User -->
  <g class="message m3">
    <rect x="765" y="359" width="310" height="49"
          rx="5" class="bubble-user"/>

    <text x="788" y="389" class="green normal">
      stack --list
    </text>

    <text x="1088" y="389" class="dim small">↵</text>
  </g>

  <!-- Message 4: Stack -->
  <g class="message m4">
    <polygon points="113,448 121,453 121,463 113,468 105,463 105,453"
             class="green"/>

    <text x="139" y="456" class="dim label">
      TECHNICAL STACK
    </text>

    <rect x="135" y="471" width="730" height="72"
          rx="5" class="bubble-response"/>

    <text x="159" y="500" class="white normal">
      TypeScript · JavaScript · Python · Rust
    </text>

    <text x="159" y="525" class="gray normal">
      FastAPI · Express · Fastify · PostgreSQL
    </text>
  </g>

  <!-- Typing indicator -->
  <g class="message m5">
    <text x="135" y="562" class="dim small">
      Samuel is building
    </text>

    <circle cx="284" cy="557" r="3" fill="#79dfbd" class="dot"/>
    <circle cx="297" cy="557" r="3" fill="#79dfbd" class="dot"/>
    <circle cx="310" cy="557" r="3" fill="#79dfbd" class="dot"/>
  </g>

  <!-- Bottom status -->
  <line x1="75" y1="595" x2="1125" y2="595"
        class="border"/>

  <text x="100" y="612" class="dim label">
    GITHUB.COM/ALCANTARA
  </text>

  <text x="1100" y="612" text-anchor="end" class="green label">
    <tspan class="cursor">_</tspan>
    ONLINE
  </text>

</svg>
