
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 1200 675"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Samuel Alcântara — Animated developer profile">

  <title>Samuel Alcântara</title>

  <style>
    text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-weight: 400;
    }

    .white { fill: #e8e8e8; }
    .gray { fill: #929292; }
    .muted { fill: #575757; }
    .green { fill: #79dfbd; }

    .normal { font-size: 19px; }
    .small { font-size: 15px; }
    .tiny { font-size: 12px; }
    .name { font-size: 23px; font-weight: 600; }

    .divider {
      stroke: #292929;
      stroke-width: 1;
    }

    .frame {
      fill: #0a0a0a;
      stroke: #414141;
      stroke-width: 1.2;
    }

    /* SYSTEM INITIALIZATION */

    .boot-scene {
      opacity: 0;
      animation: boot-scene 3.9s ease .2s forwards;
    }

    .boot-heading {
      opacity: 0;
      animation: appear .45s ease .2s forwards;
    }

    .boot-hex {
      transform-box: fill-box;
      transform-origin: center;
      animation: boot-rotation 1.2s ease .25s both;
    }

    .boot-stage {
      opacity: 0;
      animation: boot-line .35s ease forwards;
    }

    .stage-1 { animation-delay: .65s; }
    .stage-2 { animation-delay: 1.25s; }
    .stage-3 { animation-delay: 1.85s; }

    .boot-check {
      opacity: 0;
      animation: appear .3s ease forwards;
    }

    .check-1 { animation-delay: 1.05s; }
    .check-2 { animation-delay: 1.65s; }
    .check-3 { animation-delay: 2.25s; }

    .progress-track {
      opacity: 0;
      animation: appear .3s ease .65s forwards;
    }

    .progress-fill {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: progress 1.8s cubic-bezier(.4,0,.2,1) .9s forwards;
    }

    .boot-ready {
      opacity: 0;
      animation: appear .45s ease 2.85s forwards;
    }

    .ready-dot {
      animation: pulse .8s ease-in-out infinite;
    }

    /* INPUT COMPOSER */

    .composer {
      opacity: 0;
      animation: appear .4s ease 3.85s forwards;
    }

    .input-text {
      opacity: 1;
      clip-path: inset(0 100% 0 0);
    }

    .command-one {
      animation:
        typewriter .7s steps(6,end) 4.25s forwards,
        input-clear .15s ease 5s forwards;
    }

    .command-two {
      animation:
        typewriter .75s steps(12,end) 10.8s forwards,
        input-clear .15s ease 11.6s forwards;
    }

    /* BLOCK CURSOR */

    .cursor-track { opacity: 0; }

    .cursor-one {
      animation: cursor-one .7s steps(6,end) 4.25s forwards;
    }

    .cursor-two {
      animation: cursor-two .75s steps(12,end) 10.8s forwards;
    }

    .block {
      fill: #79dfbd;
      animation: blink .85s steps(2,start) infinite;
    }

    /* ENTER */

    .enter-key { opacity: 0; }

    .enter-one { animation: enter-press .4s ease 4.95s both; }
    .enter-two { animation: enter-press .4s ease 11.6s both; }

    /* USER MESSAGES */

    .user-message {
      opacity: 0;
      animation: appear .4s ease forwards;
    }

    .user-one { animation-delay: 5.3s; }
    .user-two { animation-delay: 11.95s; }

    /* THINKING */

    .thinking {
      opacity: 0;
      animation: thinking 1.3s ease forwards;
    }

    .thinking-one { animation-delay: 5.75s; }
    .thinking-two { animation-delay: 12.4s; }

    .thinking-hex {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* RESPONSES */

    .response {
      opacity: 0;
      animation: appear .4s ease forwards;
    }

    .response-one { animation-delay: 7.1s; }
    .response-two { animation-delay: 13.7s; }

    .typed {
      clip-path: inset(0 100% 0 0);
    }

    .r-name {
      animation: typewriter .7s steps(17,end) 7.35s both;
    }

    .r-role {
      animation: typewriter 1.05s steps(48,end) 8.1s both;
    }

    .r-description {
      animation: typewriter .95s steps(42,end) 9.25s both;
    }

    .r-languages {
      animation: typewriter .95s steps(39,end) 13.95s both;
    }

    .r-backend {
      animation: typewriter .95s steps(35,end) 14.95s both;
    }

    .r-database {
      animation: typewriter .55s steps(17,end) 15.95s both;
    }

    /* FINAL PLACEHOLDER */

    .placeholder,
    .footer {
      opacity: 0;
      animation: appear .5s ease 17.2s forwards;
    }

    .status {
      animation: pulse 2s ease-in-out infinite;
    }

    /* KEYFRAMES */

    @keyframes boot-scene {
      0% { opacity: 0; }
      8%, 78% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes boot-line {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes boot-rotation {
      0% { transform: rotate(-90deg) scale(.5); }
      65% { transform: rotate(280deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes progress {
      to { transform: scaleX(1); }
    }

    @keyframes typewriter {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes input-clear {
      to { opacity: 0; }
    }

    @keyframes cursor-one {
      0% { opacity: 0; transform: translateX(0); }
      5%, 88% { opacity: 1; }
      100% { opacity: 0; transform: translateX(54px); }
    }

    @keyframes cursor-two {
      0% { opacity: 0; transform: translateX(0); }
      5%, 88% { opacity: 1; }
      100% { opacity: 0; transform: translateX(108px); }
    }

    @keyframes enter-press {
      0% { opacity: 0; transform: translateY(2px); }
      25% { opacity: 1; transform: translateY(0); }
      65% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    @keyframes thinking {
      0% { opacity: 0; }
      12%, 85% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }

      .boot-scene, .thinking { opacity: 0; }

      .composer, .user-message, .response, .footer {
        opacity: 1;
      }

      .typed, .input-text {
        clip-path: none;
      }
    }
  </style>

  <!-- BACKGROUND -->
  <rect width="1200" height="675" fill="#080808"/>

  <!-- HEADER -->
  <circle cx="130" cy="39" r="4" class="green status"/>

  <text x="147" y="44" class="gray small">
    samuel@github
  </text>

  <text x="1075" y="44" text-anchor="end" class="muted tiny">
    DEVELOPER PROFILE / 001
  </text>

  <line x1="125" y1="66" x2="1100" y2="66" class="divider"/>

  <!-- SYSTEM INITIALIZATION -->
  <g class="boot-scene">

    <g class="boot-heading">
      <polygon points="142,91 151,96 151,106 142,111 133,106 133,96"
               fill="none" stroke="#79dfbd"
               stroke-width="1.6" class="boot-hex"/>

      <text x="173" y="107" class="white normal">
        INITIALIZING SYSTEM
      </text>

      <text x="173" y="130" class="muted tiny">
        SAMUEL / ENGINEERING WORKSPACE
      </text>
    </g>

    <g class="boot-stage stage-1">
      <text x="173" y="162" class="gray small">Loading runtime environment</text>
    </g>
    <g class="boot-check check-1">
      <text x="620" y="162" class="green small">OK</text>
    </g>

    <g class="boot-stage stage-2">
      <text x="173" y="190" class="gray small">Checking system components</text>
    </g>
    <g class="boot-check check-2">
      <text x="620" y="190" class="green small">OK</text>
    </g>

    <g class="boot-stage stage-3">
      <text x="173" y="218" class="gray small">Mounting developer workspace</text>
    </g>
    <g class="boot-check check-3">
      <text x="620" y="218" class="green small">OK</text>
    </g>

    <g class="progress-track">
      <rect x="173" y="239" width="470" height="3" fill="#242424"/>
      <rect x="173" y="239" width="470" height="3"
            fill="#79dfbd" class="progress-fill"/>
    </g>

    <g class="boot-ready">
      <circle cx="178" cy="264" r="4" fill="#79dfbd" class="ready-dot"/>
      <text x="192" y="269" class="green tiny">SYSTEM READY</text>
      <text x="643" y="269" text-anchor="end" class="muted tiny">100%</text>
    </g>

  </g>

  <!-- CONVERSATION 01: WHOAMI -->

  <g class="user-message user-one">
    <text x="142" y="150" class="green normal">›</text>
    <text x="173" y="150" class="white normal">whoami</text>
  </g>

  <g class="thinking thinking-one">
    <polygon points="142,183 151,188 151,198 142,203 133,198 133,188"
             fill="#79dfbd" class="thinking-hex"/>
    <text x="173" y="200" class="white normal">Thinking...</text>
  </g>

  <g class="response response-one">
    <polygon points="142,224 151,229 151,239 142,244 133,239 133,229"
             class="green"/>

    <text x="173" y="240" class="white name typed r-name">
      Samuel Alcântara
    </text>

    <text x="173" y="274" class="gray small typed r-role">
      Computer Science Student · Early-career AI Engineer
    </text>

    <text x="173" y="307" class="muted small typed r-description">
      Building software and exploring intelligent systems.
    </text>
  </g>

  <!-- CONVERSATION 02: STACK -->

  <g class="user-message user-two">
    <text x="142" y="365" class="green normal">›</text>
    <text x="173" y="365" class="white normal">stack --list</text>
  </g>

  <g class="thinking thinking-two">
    <polygon points="142,398 151,403 151,413 142,418 133,413 133,403"
             fill="#79dfbd" class="thinking-hex"/>
    <text x="173" y="415" class="white normal">Thinking...</text>
  </g>

  <g class="response response-two">
    <polygon points="142,439 151,444 151,454 142,459 133,454 133,444"
             class="green"/>

    <text x="173" y="455" class="white small typed r-languages">
      TypeScript · JavaScript · Python · Rust
    </text>

    <text x="173" y="489" class="gray small typed r-backend">
      FastAPI · Flask · Express · Fastify
    </text>

    <text x="173" y="523" class="gray small typed r-database">
      SQL · PostgreSQL
    </text>
  </g>

  <!-- CHAT COMPOSER -->

  <g class="composer">
    <rect x="125" y="570" width="975" height="56"
          rx="3" class="frame"/>

    <text x="151" y="605" class="green normal">›</text>

    <text x="181" y="605" class="white small input-text command-one">
      whoami
    </text>

    <text x="181" y="605" class="white small input-text command-two">
      stack --list
    </text>

    <g class="cursor-track cursor-one">
      <rect x="181" y="586" width="9" height="23" class="block"/>
    </g>

    <g class="cursor-track cursor-two">
      <rect x="181" y="586" width="9" height="23" class="block"/>
    </g>

    <g class="enter-key enter-one">
      <text x="1065" y="605" text-anchor="middle" class="green normal">↵</text>
    </g>

    <g class="enter-key enter-two">
      <text x="1065" y="605" text-anchor="middle" class="green normal">↵</text>
    </g>

    <text x="181" y="605" class="muted small placeholder">
      always building something...
    </text>
  </g>

  <!-- FOOTER -->

  <g class="footer">
    <text x="125" y="656" class="muted tiny">
      github.com/alcantara
    </text>

    <text x="1100" y="656" text-anchor="end" class="green tiny">
      <tspan class="status">●</tspan>
      <tspan dx="7">BUILDING</tspan>
    </text>
  </g>

</svg>
